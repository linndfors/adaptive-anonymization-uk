name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install locked development environment
        run: |
          python -m pip install uv==0.13.6
          uv sync --locked --extra dev
      - name: Lint
        run: uv run ruff check src app scripts tests
      - name: Test
        run: uv run pytest -q
      - name: Compile Python sources
        run: uv run python -m compileall -q src app scripts tests
      - name: Validate clean notebooks
        run: |
          uv run python - <<'PY'
          import json
          from pathlib import Path

          for path in Path("notebooks").glob("*.ipynb"):
              notebook = json.loads(path.read_text(encoding="utf-8"))
              for index, cell in enumerate(notebook["cells"]):
                  if cell["cell_type"] == "code":
                      compile("".join(cell["source"]), f"{path}:cell-{index}", "exec")
                      if cell.get("outputs"):
                          raise SystemExit(f"Notebook contains saved output: {path}:cell-{index}")
          PY
      - name: Build distributions
        run: uv build --out-dir dist-ci
      - name: Check distribution boundaries
        run: |
          uv run python - <<'PY'
          from pathlib import Path, PurePosixPath
          import tarfile
          import zipfile

          forbidden = {"artifacts", "raw", "cache", ".local-notes", ".uv-cache", ".venv", "__pycache__"}
          for path in Path("dist-ci").iterdir():
              if path.suffix == ".whl":
                  with zipfile.ZipFile(path) as archive:
                      names = archive.namelist()
              elif path.name.endswith(".tar.gz"):
                  with tarfile.open(path) as archive:
                      names = archive.getnames()
              else:
                  continue
              for name in names:
                  member = PurePosixPath(name)
                  if (forbidden.intersection(member.parts) or member.name == ".env"
                          or name.endswith((".pkl", ".safetensors", ".zip"))):
                      raise SystemExit(f"Private/generated content in distribution: {path}: {name}")
          PY
